<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sangeet: Traditional Indian Dholak & Musical Notes -->
  <defs>
    <linearGradient id="dholBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B3A1A"/>
      <stop offset="50%" stop-color="#C25927"/>
      <stop offset="100%" stop-color="#6F280D"/>
    </linearGradient>
  </defs>
  <!-- Dhol body barrel -->
  <path d="M12 24 C12 18 52 18 52 24 L52 40 C52 46 12 46 12 40 Z" fill="url(#dholBody)" stroke="#4A1805" stroke-width="1.5" />
  <!-- Left leather head -->
  <ellipse cx="12" cy="32" rx="4.5" ry="9" fill="#E6D3B3" stroke="#4A1805" stroke-width="1.5" />
  <circle cx="12" cy="32" r="2.5" fill="#4A1805" />
  <!-- Right leather head -->
  <ellipse cx="52" cy="32" rx="4.5" ry="9" fill="#E6D3B3" stroke="#4A1805" stroke-width="1.5" />
  <circle cx="52" cy="32" r="2.5" fill="#4A1805" />
  <!-- Ropes criss-cross -->
  <path d="M16 23 L25 41 L34 23 L43 41 L48 23" stroke="#F5ECCB" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M16 41 L25 23 L34 41 L43 23 L48 41" stroke="#F5ECCB" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Music note floating above -->
  <path d="M46 10 L46 6 L54 3 L54 7" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="44" cy="11" r="2" fill="#D4AF37" />
  <circle cx="52" cy="8" r="2" fill="#D4AF37" />
</svg>

