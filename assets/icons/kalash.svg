<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sacred Kalash (Copper/Brass pot with Mango leaves and Coconut) -->
  <defs>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93B"/>
      <stop offset="50%" stop-color="#C57A18"/>
      <stop offset="100%" stop-color="#8C4906"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
  </defs>
  <!-- Coconut (Nariyal) with Tilak -->
  <path d="M32 10 C27 10 24 16 26 24 L38 24 C40 16 37 10 32 10 Z" fill="#6D4C41" stroke="#3E2723" stroke-width="1.2" />
  <circle cx="32" cy="18" r="1.5" fill="#D32F2F" />
  
  <!-- Mango Leaves (Amra Pallava) radiating from neck -->
  <path d="M26 24 C20 18 16 12 14 16 C12 20 20 25 25 26" fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="0.8" />
  <path d="M38 24 C44 18 48 12 50 16 C52 20 44 25 39 26" fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="0.8" />
  <path d="M29 24 C26 16 26 8 32 6 C38 8 38 16 35 24" fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="0.8" />

  <!-- Kalash Pot Body -->
  <ellipse cx="32" cy="27" rx="14" ry="3.5" fill="#FFE082" stroke="#B26A00" stroke-width="1" />
  <path d="M20 28 C14 36 12 46 20 54 C24 57 40 57 44 54 C52 46 50 36 44 28 Z" fill="url(#potGrad)" stroke="#7A3D00" stroke-width="1.5" />
  <path d="M25 55 L39 55 L37 57 L27 57 Z" fill="#FFE082" stroke="#7A3D00" stroke-width="1" />

  <!-- Sacred Swastika / Holy Motif on Kalash -->
  <path d="M32 37 L32 47 M27 42 L37 42 M32 37 L36 37 M32 47 L28 47 M27 42 L27 38 M37 42 L37 46" stroke="#D32F2F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="29.5" cy="39.5" r="0.8" fill="#D32F2F" />
  <circle cx="34.5" cy="39.5" r="0.8" fill="#D32F2F" />
  <circle cx="29.5" cy="44.5" r="0.8" fill="#D32F2F" />
  <circle cx="34.5" cy="44.5" r="0.8" fill="#D32F2F" />
</svg>

