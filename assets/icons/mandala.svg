<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#D4AF37" stroke-width="1">
  <g transform="translate(100, 100)">
    <!-- Central lotus hub -->
    <circle cx="0" cy="0" r="8" fill="#D4AF37" fill-opacity="0.1" stroke-width="1.2" />
    <circle cx="0" cy="0" r="14" stroke-dasharray="2 3" stroke-width="0.8" />
    <circle cx="0" cy="0" r="22" stroke-width="1.2" />
    
    <!-- 8 Inner Petals -->
    <g id="petal8">
      <path d="M0 -22 C-5 -32 0 -40 0 -42 C0 -40 5 -32 0 -22" fill="#D4AF37" fill-opacity="0.08" stroke-width="1" />
      <circle cx="0" cy="-35" r="1.5" fill="#D4AF37" stroke="none" />
    </g>
    <use href="#petal8" transform="rotate(45)" />
    <use href="#petal8" transform="rotate(90)" />
    <use href="#petal8" transform="rotate(135)" />
    <use href="#petal8" transform="rotate(180)" />
    <use href="#petal8" transform="rotate(225)" />
    <use href="#petal8" transform="rotate(270)" />
    <use href="#petal8" transform="rotate(315)" />

    <!-- Middle Ring with scallops -->
    <circle cx="0" cy="0" r="46" stroke-width="0.8" />
    <circle cx="0" cy="0" r="50" stroke-width="1.2" />

    <!-- 16 Outer Florets -->
    <g id="outerPetal">
      <path d="M0 -50 C-7 -64 0 -76 0 -80 C0 -76 7 -64 0 -50" fill="#D4AF37" fill-opacity="0.05" stroke-width="1" />
      <path d="M-4 -60 C-4 -68 0 -72 0 -72 C0 -72 4 -68 4 -60" stroke-width="0.7" />
      <circle cx="0" cy="-84" r="2" fill="#D4AF37" stroke="none" />
    </g>
    <use href="#outerPetal" transform="rotate(22.5)" />
    <use href="#outerPetal" transform="rotate(45)" />
    <use href="#outerPetal" transform="rotate(67.5)" />
    <use href="#outerPetal" transform="rotate(90)" />
    <use href="#outerPetal" transform="rotate(112.5)" />
    <use href="#outerPetal" transform="rotate(135)" />
    <use href="#outerPetal" transform="rotate(157.5)" />
    <use href="#outerPetal" transform="rotate(180)" />
    <use href="#outerPetal" transform="rotate(202.5)" />
    <use href="#outerPetal" transform="rotate(225)" />
    <use href="#outerPetal" transform="rotate(247.5)" />
    <use href="#outerPetal" transform="rotate(270)" />
    <use href="#outerPetal" transform="rotate(292.5)" />
    <use href="#outerPetal" transform="rotate(315)" />
    <use href="#outerPetal" transform="rotate(337.5)" />
    <use href="#outerPetal" transform="rotate(360)" />

    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="92" stroke-width="0.8" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="96" stroke-width="0.6" />
  </g>
</svg>

